name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Usta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android part
        run: flutter create --platforms=android --org kg.usta --project-name usta .

      - name: App name
        run: sed -i 's/android:label="[^"]*"/android:label="Usta"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: App icon
        continue-on-error: true
        run: |
          dart pub global activate flutter_launcher_icons
          dart pub global run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - run: flutter build apk --release

      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk Usta.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Usta build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Usta/Usta.apk
